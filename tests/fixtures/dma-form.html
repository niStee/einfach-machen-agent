<!doctype html>
<html lang="en">
  <body>
    <form class="contact-message-feedback-form" action="#synthetic" method="post">
      <input id="edit-oe-first-name-0-value" name="oe_first_name[0][value]" type="text">
      <input id="edit-oe-last-name-0-value" name="oe_last_name[0][value]" type="text">
      <input id="edit-mail" name="mail" type="email">
      <select id="edit-oe-topic" name="oe_topic">
        <option>Contact us as an EU Citizen</option>
      </select>
      <input id="edit-subject-0-value" name="subject[0][value]" type="text" maxlength="100">
      <textarea id="edit-message-0-value" name="message[0][value]" maxlength="2000"></textarea>
      <input id="edit-privacy-policy" name="privacy_policy" type="checkbox">
      <button id="edit-submit" name="op" type="submit" value="Send message">Send message</button>
      <div class="messages--status" role="status" hidden>Synthetic confirmation</div>
    </form>
  </body>
</html>
